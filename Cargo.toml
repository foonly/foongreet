[package]
name = "foongreet"
version = "0.1.0"
edition = "2024"
description = "A greetd greeter with a software CRT look, drawn straight to DRM/KMS"
license = "GPL-3.0-or-later"
repository = "https://github.com/foonly/foongreet"

[[bin]]
name = "foongreet"
path = "src/greeter/main.rs"

[[bin]]
name = "foonlock"
path = "src/lock/main.rs"
required-features = ["lock"]

[dependencies]
drm = "0.15.0"
flate2 = "1.1.10"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
libc = "0.2.191"
minifb = { version = "0.29.0", optional = true }
png = "0.18.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"], optional = true }
toml = "1.1.8"

[features]
# Windowed preview for tuning the look from a desktop session.
preview = ["dep:minifb"]
# The Wayland screen locker, foonlock.
lock = ["dep:smithay-client-toolkit"]

[profile.release]
lto = true
codegen-units = 1
