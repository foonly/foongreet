[package]
name = "foongreet"
version = "0.1.0"
edition = "2024"

[dependencies]
drm = "0.15.0"
flate2 = "1.1.10"
greetd_ipc = { version = "0.10.3", features = ["sync-codec"] }
libc = "0.2.191"
minifb = { version = "0.29.0", optional = true }
png = "0.18.1"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.1.8"

[features]
# Windowed preview for tuning the look from a desktop session.
preview = ["dep:minifb"]

[profile.release]
lto = true
codegen-units = 1
