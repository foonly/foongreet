# foongreet configuration: /etc/foongreet/config.toml
# Every setting is optional. Active lines show the defaults; settings
# without a default are commented out as "#key = value" examples.

[display]
# Phosphor color: "amber" or "green".
phosphor = "amber"
# PNG shown behind the login box, converted to phosphor brightness.
#background = "/etc/foongreet/bg.png"
# Background brightness, 0.0 to 1.0. Keep it low so text stays readable.
background_dim = 0.35
# Linux console font (PSF1/PSF2, optionally gzipped).
font = "/usr/share/kbd/consolefonts/default8x16.psfu.gz"
# Screen for the login, by connector name as in /sys/class/drm (without
# the "cardN-" prefix) or `hyprctl monitors`. Other screens show an empty
# tube. Default: the first connected screen.
#output = "DP-1"
# Seconds to stay black before the power-on animation, giving monitors
# time to sync to the new signal. Raise it if the animation is cut off,
# lower it if the wait feels long.
startup_delay = 2.0
# Draw to /dev/fb0 instead of DRM/KMS. Only one screen; ignores `output`.
fbdev = false

[login]
# Preselected user; overrides the remembered one. Empty means none.
default_user = ""
# Where the last user and session are remembered. Must be writable by the
# greeter user; `make install` creates it.
cache_dir = "/var/cache/foongreet"

[power]
# Commands for F1 and F2.
poweroff = "systemctl poweroff"
reboot = "systemctl reboot"

# Extra sessions, listed before those found in /usr/share/wayland-sessions.
# Repeat the block for more.
#[[session]]
#name = "Sway (software rendering)"
#command = "sway"
#env = ["WLR_RENDERER=pixman", "XDG_SESSION_TYPE=wayland"]
